[package]
name = "teralion-provider"
version.workspace = true
edition.workspace = true
license.workspace = true

[dependencies]
blake3 = "1.8"
data-sync = { path = "../../data-sync" }
market-types = { path = "../../market-types" }
reqwest = { version = "0.12", default-features = false, features = ["blocking", "rustls-tls"] }
run-planner = { path = "../../run-planner" }
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["raw_value"] }

[dev-dependencies]
market-state = { path = "../../market-state" }
replay-engine = { path = "../../replay-engine" }
strategy-api = { path = "../../strategy-api" }
tempfile = "3"

[[bench]]
name = "verified_cache_pipeline"
harness = false

[lints]
workspace = true
