[package]
name = "osmium-cli"
version.workspace = true
publish.workspace = true
edition.workspace = true

[[bin]]
name = "osmium"
path = "src/main.rs"

# The walk-through of docs/guide/writing-a-strategy.md; its test runs with the workspace.
[[example]]
name = "breakout"
test = true

[dependencies]
