osmium-ledger = { path = "../osmium-ledger" }
osmium-matching = { path = "../osmium-matching" }
osmium-md = { path = "../osmium-md" }
osmium-replay = { path = "../osmium-replay" }
osmium-runner = { path = "../osmium-runner" }
osmium-strategy = { path = "../osmium-strategy" }

[dev-dependencies]
osmium-book = { path = "../osmium-book" }
osmium-fixture = { path = "../osmium-fixture" }
osmium-types = { path = "../osmium-types" }

[lints]
workspace = true
