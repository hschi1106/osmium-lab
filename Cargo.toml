[workspace]
members = [
    "crates/market-state",
    "crates/market-types",
    "crates/osmium-md",
    "crates/osmium-runner",
    "crates/execution-sim",
    "crates/replay-engine",
    "crates/run-planner",
    "crates/strategy-api",
    "crates/example-strategy",
]
resolver = "2"

[workspace.package]
version = "0.1.0"
edition = "2024"
publish = false

[workspace.lints.rust]
unsafe_code = "forbid"
