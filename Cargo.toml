[workspace]
members = [
    "crates/market-state",
    "crates/market-types",
    "crates/osmium-runner",
    "crates/osmium-config",
    "crates/normalizer/twse",
    "crates/normalizer/tpex",
    "crates/normalizer/taifex",
    "crates/osmium-cli",
    "crates/data-sync",
    "crates/execution-sim",
    "crates/replay-engine",
    "crates/run-planner",
    "crates/strategy-api",
]
resolver = "2"

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "MIT"

[workspace.lints.rust]
unsafe_code = "forbid"
