[workspace]
members = [
    "crates/osmium-book",
    "crates/osmium-examples",
    "crates/osmium-fixture",
    "crates/osmium-ledger",
    "crates/osmium-matching",
    "crates/osmium-md",
    "crates/osmium-replay",
    "crates/osmium-strategy",
    "crates/osmium-types",
    "crates/osmium-runner",
]
resolver = "2"

[workspace.package]
version = "0.1.0"
edition = "2024"
publish = false

[workspace.lints.rust]
unsafe_code = "forbid"
