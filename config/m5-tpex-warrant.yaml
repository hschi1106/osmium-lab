config_version: 2
data:
  source: teralion
  data_root: target/m5-tpex-warrant-data
  source_policy: strict
  cache_policy: reuse_or_rebuild
universe:
  trading_dates: ["2026-07-20"]
  instruments:
    - market: tpex
      symbol: "72328U"
      instrument_kind: warrant
      session_kinds: [regular]
      reference:
        underlying: "6488"
        expiry: "2026-09-23"
        strike: "441.14"
        option_side: put
        currency: TWD
        multiplier: "1"
        quantity_unit: trading_unit
        units_per_trading_unit: 1000
        provenance: "TPEx warrant issue endpoint and Teralion daily instrument 2026-07-20"
strategy:
  id: acceptance.multi-market
  version: "1"
  parameters: {}
replay:
  data_policy: strict
simulation:
  fill: { evidence: top_of_book, quantity: observed }
  market_data_latency_ms: 0
  order_latency_ms: 0
  allocation: acceptance_sequence
  slippage: { model: adverse_fixed_delta, delta: "0" }
  fee:
    model: configured_rate
    rate: "0"
    applicable_sides: [buy, sell]
    minimum: "0"
    precision: 0
    rounding: half_up
    provenance: "TPEx warrant acceptance fixture"
  tax:
    model: configured_rate
    rate: "0"
    applicable_sides: [sell]
    minimum: "0"
    precision: 0
    rounding: down
    provenance: "TPEx warrant acceptance fixture"
  initial_cash: { currency: TWD, amount: "10000000" }
  position_accounting: average_cost_v1
  marking: { model: last_observable_mark_v1, allow_midpoint_fallback: false }
instrument_economics:
  - market: tpex
    symbol: "72328U"
    quantity_unit: trading_unit
    units_per_trading_unit: 1000
    currency: TWD
    multiplier: "1"
    provenance: "TPEx trading rules and warrant issue reference"
output: { publication: create_new }
