config_version: 2
data:
  source: teralion
  data_root: target/m5-option-data
  source_policy: strict
  cache_policy: reuse_or_rebuild
universe:
  trading_dates: ["2026-07-28"]
  instruments:
    - market: taifex
      symbol: "TXFH6"
      session_kinds: [after_hours, regular]
    - market: taifex
      symbol: "TXO24000U6"
      instrument_kind: option
      session_kinds: [after_hours, regular]
      reference:
        underlying: TAIEX
        expiry: "2026-09-16"
        strike: "24000"
        option_side: put
        currency: TWD
        multiplier: "50"
        quantity_unit: contract
        units_per_trading_unit: 1
        provenance: "TAIFEX TXO product specification, symbol code and Teralion daily expiry month"
strategy:
  id: acceptance.multi-market
  version: "1"
  parameters: {}
replay:
  data_policy: strict
simulation:
  fill: { evidence: top_of_book, quantity: observed }
  market_data_latency_ms: 0
  order_latency_ms: 0
  allocation: acceptance_sequence
  slippage: { model: adverse_fixed_delta, delta: "0" }
  fee:
    model: configured_rate
    rate: "0"
    applicable_sides: [buy, sell]
    minimum: "0"
    precision: 0
    rounding: half_up
    provenance: "M5 option acceptance fixture"
  tax:
    model: configured_rate
    rate: "0"
    applicable_sides: [sell]
    minimum: "0"
    precision: 0
    rounding: down
    provenance: "M5 option acceptance fixture"
  initial_cash: { currency: TWD, amount: "100000000" }
  position_accounting: average_cost_v1
  marking: { model: last_observable_mark_v1, allow_midpoint_fallback: false }
instrument_economics:
  - market: taifex
    symbol: "TXFH6"
    quantity_unit: contract
    units_per_trading_unit: 1
    currency: TWD
    multiplier: "200"
    provenance: "M3 TAIFEX futures contract fixture"
  - market: taifex
    symbol: "TXO24000U6"
    quantity_unit: contract
    units_per_trading_unit: 1
    currency: TWD
    multiplier: "50"
    provenance: "TAIFEX TXO NTD 50 per index point"
output: { publication: create_new }
