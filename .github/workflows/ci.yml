name: CI

on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  quality-and-release-acceptance:
    name: Quality and acceptance tooling
    runs-on: ubuntu-24.04
    timeout-minutes: 30

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Install pinned Rust toolchain
        run: rustup show active-toolchain

      - name: Run release and acceptance checks
        run: |
          tools/acceptance/run_m1_acceptance.sh \
            --output target/acceptance-m1-ci

      - name: Build and smoke-test internal archive
        run: |
          tools/release/package.sh --output target/osmium-internal.tar.gz
          staging=$(mktemp -d)
          trap 'rm -rf "$staging"' EXIT
          tar -xzf target/osmium-internal.tar.gz -C "$staging"
          archive_root=$(tar -tzf target/osmium-internal.tar.gz | sed -n '1s#/$##p')
          "$staging/$archive_root/bin/osmium" version
          "$staging/$archive_root/bin/osmium" --help

      - name: Upload acceptance evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: acceptance-m1-${{ github.sha }}
          path: |
            target/acceptance-m1-ci
            target/acceptance-m1-ci.failed
            target/osmium-internal.tar.gz
            target/osmium-internal.tar.gz.sha256
          if-no-files-found: error
          retention-days: 30
