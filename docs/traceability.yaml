schema_version: 2
source_of_truth:
  path: docs/product-requirements.md
  description: 產品範圍、架構邊界、術語與交付優先順序

repository_scope: release-tree
distribution: public-release
delivery: source-repository-and-binary-archive
crate_api_policy: source-visible-unstable-library-api
config_policy:
  current_schema: 2
  legacy_schema_1: rejected-with-upgrade-error
  representative_example: examples/config.yaml

cleanup_status:
  status: complete
  preserved:
    - production crates and tests
    - examples/config.yaml
    - fixtures/smoke
    - repository-owned synthetic fixture matrix
  removed:
    - config/
    - docs/increments/
    - docs/verification/
    - tools/acquisition/
    - milestone-specific acceptance runners and scripts
  historical_evidence: external-archive-or-git-history

milestones:
  M1:
    implementation: complete
    acceptance_evidence: external-historical-archive
  M2:
    implementation: complete
    acceptance_evidence: external-historical-archive
    compatibility: not-maintained-in-release
  M3:
    implementation: complete
    acceptance_evidence: external-historical-archive
  M4:
    implementation: complete
    acceptance_evidence: external-historical-archive
  M5:
    implementation: complete
    acceptance_evidence: external-historical-archive
    current_fixture_scopes:
      - twse-warrant
      - tpex-warrant
      - taifex-option

implementation_paths:
  config_and_runner:
    - crates/osmium-config
    - crates/osmium-runner
    - crates/osmium-cli
  data_and_replay:
    - crates/data-sync
    - crates/run-planner
    - crates/replay-engine
  market_domain:
    - crates/market-types
    - crates/market-state
    - crates/normalizer/twse
    - crates/normalizer/tpex
    - crates/normalizer/taifex
  strategy_and_simulation:
    - crates/strategy-api
    - crates/execution-sim

fixture_policy:
  smoke:
    path: fixtures/smoke
    scope: synthetic-redistributable
  acceptance:
    manifest: fixtures/acceptance/manifest.yaml
    scope: synthetic-redistributable
    committed_payload: repository-owned-synthetic-scenarios
    full_day_payload: external-user-owned-data-root
  verifier: tools/acceptance/verify_compact_fixtures.sh

fixture_matrix:
  - id: synthetic-twse-equity
    path: fixtures/teralion/twse/SYNTH-TWSE-EQ/2026-07-20
    kind: equity
    sessions: [regular]
    complete_day: false
  - id: synthetic-twse-warrant
    path: fixtures/teralion/twse/SYNTH-TWSE-W/2026-07-20
    kind: warrant
    sessions: [regular]
    complete_day: false
  - id: synthetic-tpex-equity
    path: fixtures/teralion/tpex/SYNTH-TPEX-EQ/2026-07-20
    kind: equity
    sessions: [regular]
    complete_day: false
  - id: synthetic-tpex-warrant
    path: fixtures/teralion/tpex/SYNTH-TPEX-W/2026-07-20
    kind: warrant
    sessions: [regular]
    complete_day: false
  - id: synthetic-taifex-future
    path: fixtures/teralion/taifex/SYNTH-FUT/2026-07-20
    kind: future
    sessions: [regular]
    complete_day: false
  - id: synthetic-taifex-option
    path: fixtures/teralion/taifex/SYNTH-OPT/2026-07-20
    kind: option
    sessions: [after_hours, regular]
    complete_day: false

validation:
  release_document: docs/release/VALIDATION.md
  cli_document: docs/operations/cli.md
  compact_fixture_verifier: tools/acceptance/verify_compact_fixtures.sh
  bundle_verifier: tools/acceptance/verify_fixture_bundle.sh
  required_commands:
    - cargo fmt --check
    - cargo clippy --workspace --all-targets -- -D warnings
    - cargo test --workspace

external_follow_up:
  - full-day formal acceptance with authorized user-owned data when required
