schema_version: 3
source_of_truth: docs/product-requirements.md

contracts:
  cli:
    version: 4
    implementation: crates/osmium-cli
    documentation: docs/operations/cli.md
  run_config:
    version: 2
    implementation: crates/osmium-config
    documentation: docs/config-reference.md
  run_manifest:
    version: 2
    implementation: crates/osmium-runner/src/artifacts.rs
  event_schema:
    version: 3
    implementation: crates/market-types/src/event.rs
    documentation: docs/architecture/replay-model.md
  replay_cache:
    version: 1
    implementation: crates/data-sync/src/cache.rs
    documentation: docs/architecture/data-flow.md
  accounting:
    version: 6
    implementation: crates/execution-sim/src/accounting.rs
    documentation: docs/architecture/execution-model.md

requirements:
  DATA-01:
    implementation:
      - crates/data-sync/src/query.rs
      - crates/data-sync/src/cursor.rs
      - crates/data-sync/src/sync.rs
      - crates/data-sync/src/transport.rs
    verification:
      - crates/data-sync/src/cursor.rs
      - crates/data-sync/src/sync.rs
  DATA-02:
    implementation:
      - crates/data-sync/src/storage.rs
      - crates/data-sync/src/partition.rs
    verification:
      - crates/data-sync/src/storage.rs
      - crates/data-sync/src/partition.rs
  DATA-03:
    implementation: [crates/data-sync/src/verify.rs]
    verification: [crates/data-sync/src/verify.rs]
  DATA-04:
    implementation: [crates/data-sync/src/cache.rs]
    verification: [crates/data-sync/src/cache.rs]
  DATA-05:
    implementation:
      - crates/osmium-config/src/lib.rs
      - crates/run-planner/src/session.rs
    verification:
      - crates/run-planner/tests/config.rs
      - crates/run-planner/tests/partition_plan.rs

  REPLAY-01:
    implementation:
      - crates/market-types/src/event.rs
      - crates/normalizer/twse
      - crates/normalizer/tpex
      - crates/normalizer/taifex
    verification:
      - crates/market-types/tests/domain_events.rs
      - crates/normalizer/twse/tests
      - crates/normalizer/tpex/tests
      - crates/normalizer/taifex/tests
  REPLAY-02:
    implementation:
      - crates/replay-engine/src/ordering.rs
      - crates/replay-engine/src/stream.rs
    verification: [crates/replay-engine/tests/replay.rs]
  REPLAY-03:
    implementation: [crates/market-state]
    verification: [crates/market-state/tests/reducer.rs]
  REPLAY-04:
    implementation:
      - crates/replay-engine/src/engine.rs
      - crates/osmium-runner/src/lib.rs
    verification:
      - crates/replay-engine/tests/replay.rs
      - crates/strategy-api/tests/strategy.rs
  REPLAY-05:
    implementation:
      - crates/run-planner/src/session.rs
      - crates/replay-engine/src/engine.rs
    verification:
      - crates/run-planner/tests/partition_plan.rs
      - crates/replay-engine/tests/full_fixture.rs
  REPLAY-06:
    implementation:
      - crates/replay-engine
      - crates/market-state
      - crates/osmium-cli/src/command.rs
    verification:
      - crates/replay-engine/tests
      - crates/market-state/tests

  STRAT-01:
    implementation: [crates/strategy-api]
    verification:
      - crates/strategy-api/tests/strategy.rs
      - crates/strategy-api/tests/registry.rs

  SIM-01:
    implementation:
      - crates/execution-sim/src/lib.rs
      - crates/execution-sim/src/depth.rs
      - crates/execution-sim/src/scheduled.rs
      - crates/osmium-runner/src/control.rs
      - crates/osmium-runner/src/visibility.rs
    verification:
      - crates/execution-sim/src/lib.rs
      - crates/execution-sim/src/depth.rs
      - crates/execution-sim/src/scheduled.rs
      - crates/osmium-runner/src/scheduled.rs
  SIM-02:
    implementation: [crates/execution-sim/src/accounting.rs]
    verification: [crates/execution-sim/src/accounting.rs]

  OPS-01:
    implementation: [crates/osmium-cli]
    verification:
      - crates/osmium-cli/src/lib.rs
      - crates/osmium-cli/src/market_replay.rs
  OPS-02:
    implementation: [crates/osmium-runner/src/artifacts.rs]
    verification: [crates/osmium-runner/src/artifacts.rs]
  NFR-01:
    implementation:
      - crates/replay-engine/src/checksum.rs
      - crates/market-state/src/canonical.rs
      - crates/osmium-runner/src/artifacts.rs
    verification:
      - crates/replay-engine/tests/replay.rs
      - crates/osmium-runner/src/artifacts.rs
  NFR-02:
    implementation:
      - crates/replay-engine/src/stream.rs
      - crates/data-sync/src/cache.rs
    verification: [crates/replay-engine/tests/replay.rs]
  NFR-03:
    implementation:
      - crates/data-sync/src/query.rs
      - crates/osmium-config/src/lib.rs
      - crates/osmium-runner/src/artifacts.rs
    verification:
      - crates/data-sync/src/query.rs
      - crates/osmium-config/src/lib.rs
      - crates/osmium-runner/src/artifacts.rs

fixtures:
  scope: repository-owned-synthetic
  complete_day: false
  manifest: fixtures/acceptance/manifest.yaml
  verifier: tools/acceptance/verify_compact_fixtures.sh
  matrix:
    - twse-equity
    - twse-warrant
    - tpex-equity
    - tpex-warrant
    - taifex-future
    - taifex-option

release_validation: docs/operations/validation.md
