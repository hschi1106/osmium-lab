schema_version: 1

source_of_truth:
  path: docs/product-requirements.md
  description: osmium-lab 產品範圍、術語、優先順序與高階驗收基準

status_values:
  - not_started
  - in_progress
  - partial
  - complete
  - blocked
  - not_run

status_meaning:
  not_started: 尚未產生可 review 的實質內容或證據
  in_progress: 已開始但尚未達到該階段完成條件
  partial: 僅完成該階段部分文件、部分里程碑或部分 market／format 的範圍
  complete: 已完成目前需求所定義的該階段範圍
  blocked: 已知外部條件阻止繼續，且 blocker 已記錄
  not_run: 實作或 entry gate 已就緒，但正式驗收程序尚未完整執行

milestone_status:
  M1:
    implementation: complete
    formal_acceptance: complete
    completion_quality: strict
    evidence: docs/verification/evidence/m1/formal-2026-07-31/acceptance-report.yaml
  M2:
    reference_scope: TWSE 2330 2026-07-27 regular
    implementation: complete
    formal_acceptance: complete
    completion_quality: strict
    evidence: docs/verification/evidence/m2/refreshed-2026-07-31.yaml
  M3:
    reference_scope: TAIFEX TXFH6/CDFH6/CAFH6 2026-07-20; four-instrument extension pending
    specification: complete
    source_evidence: complete
    fixtures: partial
    implementation: partial
    formal_acceptance: blocked
    completion_quality: partial
    evidence:
      - docs/verification/evidence/m3/source-selection-2026-07-31.yaml
      - docs/verification/m3-acceptance.md
      - docs/verification/evidence/m3/formal-<UTC-date>/acceptance-report.yaml
    pending:
      - authorized TWSE 2330 2026-07-20 tick fixture and source/cache lineage
      - four-instrument offline ordering, strategy and performance acceptance
      - close M3 formal acceptance after all M3-AC-01..17 are Passed
  M4:
    implementation: not_started

field_meaning:
  planned_milestones: 預定交付範圍，不代表目前已實作
  planned_design_documents: 預定承接需求的下游文件，不代表目前已有內容
  planned_verification: 預定驗證方法與規格文件，不代表測試已執行
  supporting_documents: 已存在的需求或增量規格，只提供追蹤 context
  verification_evidence: 已實際執行且可檢查的 test report、checksum 或 benchmark
  implementation_paths: 已確認承接需求的實作路徑

