schema_version: 2
source_of_truth:
  path: docs/product-requirements.md
  description: 產品範圍、架構邊界、術語與交付優先順序

repository_scope: release-tree
distribution: private-internal
delivery: binary-archive-or-installer
crate_api_policy: internal-implementation-boundary
config_policy:
  current_schema: 2
  legacy_schema_1: rejected-with-upgrade-error
  representative_example: examples/config.yaml

cleanup_status:
  status: complete
  preserved:
    - production crates and tests
    - examples/config.yaml
    - fixtures/smoke
    - compact representative real-data slices
  removed:
    - config/
    - docs/increments/
    - docs/verification/
    - tools/acquisition/
    - milestone-specific acceptance runners and scripts
  historical_evidence: external-archive-or-git-history

milestones:
  M1:
    implementation: complete
    acceptance_evidence: external-historical-archive
  M2:
    implementation: complete
    acceptance_evidence: external-historical-archive
    compatibility: not-maintained-in-release
  M3:
    implementation: complete
    acceptance_evidence: external-historical-archive
  M4:
    implementation: complete
    acceptance_evidence: external-historical-archive
  M5:
    implementation: complete
    acceptance_evidence: external-historical-archive
    current_fixture_scopes:
      - twse-warrant
      - tpex-warrant
      - taifex-option

implementation_paths:
  config_and_runner:
    - crates/osmium-config
    - crates/osmium-runner
    - crates/osmium-cli
  data_and_replay:
    - crates/data-sync
    - crates/run-planner
    - crates/replay-engine
  market_domain:
    - crates/market-types
    - crates/market-state
    - crates/normalizer/twse
    - crates/normalizer/tpex
    - crates/normalizer/taifex
  strategy_and_simulation:
    - crates/strategy-api
    - crates/execution-sim

fixture_policy:
  smoke:
    path: fixtures/smoke
    scope: synthetic-redistributable
  acceptance:
    manifest: fixtures/acceptance/manifest.yaml
    scope: private-internal-review-only
    committed_payload: compact-representative-slices
    full_day_payload: external-authorized-bundle
  verifier: tools/acceptance/verify_compact_fixtures.sh
  twse_fixture_rule:
    retained: fixtures/teralion/twse/2330/2026-07-20
    removed: fixtures/teralion/twse/2330/2026-07-27

fixture_matrix:
  - id: twse-equity-2330-2026-07-20
    path: fixtures/teralion/twse/2330/2026-07-20
    kind: equity
    sessions: [regular]
    complete_day: false
  - id: twse-warrant-03003T-2026-07-20
    path: fixtures/teralion/twse/03003T/2026-07-20
    kind: warrant
    sessions: [regular]
    complete_day: false
  - id: tpex-equity-6488-2026-07-20
    path: fixtures/teralion/tpex/6488/2026-07-20
    kind: equity
    sessions: [regular]
    complete_day: false
  - id: tpex-warrant-72328U-2026-07-20
    path: fixtures/teralion/tpex/72328U/2026-07-20
    kind: warrant
    sessions: [regular]
    complete_day: false
  - id: taifex-futures-CAFH6-2026-07-20
    path: fixtures/teralion/taifex/CAFH6/2026-07-20
    kind: future
    sessions: [regular]
    complete_day: false
  - id: taifex-futures-CDFH6-2026-07-20
    path: fixtures/teralion/taifex/CDFH6/2026-07-20
    kind: future
    sessions: [after_hours, regular]
    complete_day: false
  - id: taifex-futures-TXFH6-2026-07-20
    path: fixtures/teralion/taifex/TXFH6/2026-07-20
    kind: future
    sessions: [after_hours, regular]
    complete_day: false
  - id: taifex-futures-TXFH6-2026-07-28
    path: fixtures/teralion/taifex/TXFH6/2026-07-28
    kind: future
    sessions: [after_hours, regular]
    complete_day: false
  - id: taifex-option-TXO24000U6-2026-07-28
    path: fixtures/teralion/taifex/TXO24000U6/2026-07-28
    kind: option
    sessions: [after_hours, regular]
    complete_day: false

validation:
  release_document: docs/release/VALIDATION.md
  cli_document: docs/operations/cli.md
  compact_fixture_verifier: tools/acceptance/verify_compact_fixtures.sh
  bundle_verifier: tools/acceptance/verify_fixture_bundle.sh
  required_commands:
    - cargo fmt --check
    - cargo clippy --workspace --all-targets -- -D warnings
    - cargo test --workspace

external_follow_up:
  - private artifact store and SSO authorization review
  - full-day formal acceptance report retrieval when required
